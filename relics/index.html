<meta name="description" content="Open the relics of The Lost Pages — Trillionbear's collection on Solana.">
<link rel="canonical" href="https://thelostpages.net/relics/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  canvas.read{cursor:pointer}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%)}
  #hint,#close,#home{font:12px/1 Georgia,'Times New Roman',serif;letter-spacing:.32em;text-transform:lowercase;color:#b08a55}
  #hint{position:fixed;left:0;right:0;bottom:154px;text-align:center;pointer-events:none;opacity:.8;transition:opacity .8s;z-index:4;text-shadow:0 1px 8px #000,0 0 12px #000}
  #hint.off{opacity:0}
  #close{position:fixed;top:18px;right:20px;background:none;border:1px solid #5a4424;padding:9px 12px 9px 15px;
    cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
  #close.on{opacity:.85;pointer-events:auto}
  #close:hover{color:#ffc27a;border-color:#b08a55}
  #home{position:fixed;top:18px;left:20px;z-index:6;text-decoration:none;background:rgba(0,0,0,.35);
    border:1px solid #3d2e18;padding:9px 12px 9px 14px;transition:color .3s,border-color .3s}
  #home:hover{color:#ffc27a;border-color:#b08a55}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    pointer-events:none;font:12px/1 Georgia,'Times New Roman',serif;letter-spacing:.4em;color:#b08a55;transition:opacity .9s;z-index:4}
  #load.off{opacity:0}
  #load img{display:block;max-width:min(420px,70vw);max-height:22vh;width:auto;height:auto;object-fit:contain;
    filter:drop-shadow(0 0 16px rgba(176,138,85,.35));margin-bottom:8px}
  #load img[hidden]{display:none}
  #load i{display:block;width:160px;height:1px;background:#3a2c1a}
  #load b{display:block;height:1px;width:0;background:#ffb060;box-shadow:0 0 8px #ff8a2a;transition:width .2s}
  #nowebgl{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:24px;text-align:center;font:14px/1.6 Georgia,'Times New Roman',serif;letter-spacing:.12em;color:#b08a55;z-index:8}
  #nowebgl.on{display:flex}
  #nowebgl a{color:#f0c878;text-decoration:none;letter-spacing:.28em;text-transform:lowercase;border-bottom:1px solid #5a4424;padding-bottom:4px}
  #nowebgl a:hover{color:#ffc27a;border-color:#b08a55}
  #nowebgl.on ~ #shelf, #nowebgl.on ~ #close, #nowebgl.on ~ #hint{display:none !important}
  .fontwarm{position:absolute;left:-999px;top:0;visibility:hidden}

  #shelf{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;
    gap:8px 10px;padding:10px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.92) 70%,rgba(0,0,0,.55));
    box-sizing:border-box}
  #shelf button{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;margin:0;
    padding:5px 5px 7px;background:rgba(8,4,16,.55);border:1px solid #3d2e18;border-radius:4px;
    color:#c4a36a;font:10px/1.2 Georgia,'Times New Roman',serif;letter-spacing:.04em;cursor:pointer;
    transition:color .3s,border-color .3s,box-shadow .3s,background .3s}
  #shelf button img{display:block;width:72px;height:72px;object-fit:contain;background:#050308;border-radius:2px;pointer-events:none}
  #shelf button span{display:block;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #shelf button:hover{color:#ffc27a;border-color:#b08a55;background:rgba(20,10,4,.7)}
  #shelf button.on{color:#f0c878;border-color:#c9a84c;background:rgba(30,18,6,.75);
    box-shadow:0 0 0 1px rgba(201,168,76,.4),0 0 16px rgba(201,168,76,.38);cursor:default}
  #shelf button:focus-visible{outline:2px solid #c9a84c;outline-offset:2px}
  .shelf-group{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .shelf-group + .shelf-group{border-left:1px solid rgba(176,138,85,.28);padding-left:16px;margin-left:6px}
  .shelf-label{font:9px/1 Georgia,'Times New Roman',serif;letter-spacing:.22em;text-transform:uppercase;
    color:#8a6c42}
  .shelf-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px}
  @media (max-width:720px){
    #home{top:12px;left:12px;padding:8px 8px 8px 10px;letter-spacing:.16em;font-size:11px}
    #close{top:12px;right:12px}
    #shelf{flex-wrap:nowrap;justify-content:flex-start;align-items:flex-end;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;gap:8px;padding:10px 12px 14px;scrollbar-color:#5a4424 transparent}
    #shelf::-webkit-scrollbar{height:4px}
    #shelf::-webkit-scrollbar-thumb{background:#5a4424;border-radius:4px}
    #shelf button{flex:0 0 auto;width:76px;padding:4px 4px 6px}
    #shelf button img{width:64px;height:64px}
    .shelf-group{flex:0 0 auto;align-items:flex-start}
    .shelf-tiles{flex-wrap:nowrap}
    #hint{bottom:148px;padding:0 12px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="load">
  <img id="poster" alt="" hidden>
  <span>loading</span>
  <i><b id="bar"></b></i>
</div>
<div id="nowebgl" role="alert">
  <p>This relic needs WebGL, which this browser doesn't support.</p>
  <a href="/">back to The Lost Pages</a>
</div>
<div id="hint" class="off"></div>
<a id="home" href="/">the lost pages</a>
<button id="close" type="button">close</button>
<span class="fontwarm" style="font-family:'IM Fell English'">a<i>a</i></span>

<nav id="shelf" aria-label="Choose a relic"></nav>
<script>
(function(){
  function hasWebGL(){
    try {
      var c = document.createElement('canvas');
      return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
    } catch (e) { return false; }
  }
  if (!hasWebGL()){
    document.getElementById('load').className = 'off';
    document.getElementById('nowebgl').className = 'on';
    return;
  }
  // Add a relic by appending an entry here and saving a square WebP into thumbs/.
  var RELICS = [
    { id:'builders',   name:'Builders',    title:'TT 1 | The Book of Builders',    code:'book1.js',  poster:'../assets/covers/builders.webp',   thumb:'thumbs/builders.webp' },
    { id:'builders-2', name:'Builders II', title:'TT 1 | The Book of Builders II', code:'book2.js',  poster:'../assets/covers/builders-2.webp', thumb:'thumbs/builders-2.webp' },
    { id:'rebels',     name:'Rebels',      title:'TT 2 | The Book of Rebels',      code:'book3.js',  poster:'../assets/covers/rebels.webp',     thumb:'thumbs/rebels.webp' },
    { id:'kings',      name:'Kings',       title:'TT 3 | The Book of Kings',       code:'book4.js',  poster:'../assets/covers/kings.webp',      thumb:'thumbs/kings.webp' },
    { id:'kings-2',    name:'Kings II',    title:'TT 3 | The Book of Kings II',    code:'book5.js',  poster:'../assets/covers/kings-2.webp',   thumb:'thumbs/kings-2.webp' },
    { id:'seekers',    name:'Seekers',     title:'TT 4 | The Book of Seekers',     code:'book6.js',  poster:'../assets/covers/seekers.webp',    thumb:'thumbs/seekers.webp' },
    { id:'hunters',    name:'Hunters',     title:'TT 5 | The Book of Hunters',     code:'book10.js', poster:'../assets/covers/hunters.webp',    thumb:'thumbs/hunters.webp' },
    { id:'watchers',   name:'Watchers',    title:'TT 6 | The Book of Watchers',    code:'book11.js', poster:'../assets/covers/watchers.webp',   thumb:'thumbs/watchers.webp' },
    { id:'warriors',   name:'Warriors',    title:'TT 7 | The Book of Warriors',    code:'book7.js',  poster:'../assets/covers/warriors.webp',   thumb:'thumbs/warriors.webp' },
    { id:'crusaders',  name:'Crusaders',   title:'TT 8 | The Book of Crusaders',   code:'book8.js',  poster:'../assets/covers/crusaders.webp',  thumb:'thumbs/crusaders.webp' },
    { id:'seers',      name:'Seers',       title:'TT 9 | The Book of Seers',       code:'book9.js',  poster:'../assets/covers/seers.webp',      thumb:'thumbs/seers.webp' },
    { id:'staff',      name:'Staff',       title:'Relic | The Staff of Trillionbear', code:'staff.js', poster:'thumbs/staff.webp',             thumb:'thumbs/staff.webp',      group:'other' }
  ];
  var GROUPS = [
    { id:'books', label:'Books' },
    { id:'other', label:'Other relics' }
  ];
  var BY_ID = {};
  RELICS.forEach(function(r){ BY_ID[r.id] = r; });
  var key = (location.hash || '').replace('#', '');
  if (!BY_ID[key]){ try { key = sessionStorage.getItem('tb-relic') || sessionStorage.getItem('tb-book'); } catch (e) {} }
  if (!BY_ID[key]) key = 'builders';
  document.title = BY_ID[key].title + ' — Relics';
  var poster = document.getElementById('poster');
  poster.alt = BY_ID[key].title;
  poster.onload = function(){ poster.hidden = false; };
  poster.onerror = function(){ poster.hidden = true; };
  poster.src = BY_ID[key].poster;

  var shelf = document.getElementById('shelf');
  function go(k){
    if (!BY_ID[k] || k === key) return;
    try {
      sessionStorage.setItem('tb-relic', k);
      sessionStorage.setItem('tb-book', k);
    } catch (e) {}
    location.hash = k; location.reload();
  }
  function addTile(parent, r){
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('data-relic', r.id);
    b.setAttribute('aria-label', r.name);
    if (r.id === key){
      b.className = 'on';
      b.setAttribute('aria-current', 'true');
    }
    var img = document.createElement('img');
    img.src = r.thumb;
    img.alt = '';
    img.width = 256;
    img.height = 256;
    img.decoding = 'async';
    var name = document.createElement('span');
    name.textContent = r.name;
    b.appendChild(img);
    b.appendChild(name);
    b.addEventListener('click', function(){ go(r.id); });
    parent.appendChild(b);
  }
  GROUPS.forEach(function(g){
    var items = RELICS.filter(function(r){ return (r.group || 'books') === g.id; });
    if (!items.length) return;
    var section = document.createElement('div');
    section.className = 'shelf-group';
    section.setAttribute('role', 'group');
    section.setAttribute('aria-label', g.label);
    var label = document.createElement('span');
    label.className = 'shelf-label';
    label.textContent = g.label;
    var row = document.createElement('div');
    row.className = 'shelf-tiles';
    items.forEach(function(r){ addTile(row, r); });
    section.appendChild(label);
    section.appendChild(row);
    shelf.appendChild(section);
  });
  var active = shelf.querySelector('button.on');
  if (active && active.scrollIntoView){
    try { active.scrollIntoView({ inline:'center', block:'nearest' }); } catch (e) { active.scrollIntoView(); }
  }
  shelf.addEventListener('keydown', function(e){
    var dir = { ArrowRight:1, ArrowLeft:-1, ArrowDown:1, ArrowUp:-1 };
    if (!(e.key in dir) && e.key !== 'Home' && e.key !== 'End') return;
    e.stopPropagation();
    var btns = shelf.querySelectorAll('button');
    var i = Array.prototype.indexOf.call(btns, document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = btns.length - 1;
    else i = (i + dir[e.key] + btns.length) % btns.length;
    btns[i].focus();
  });
  window.addEventListener('hashchange', function(){ go((location.hash || '').replace('#', '')); });
  function add(src, done){ var s = document.createElement('script'); s.src = src; s.onload = done; s.onerror = done; document.body.appendChild(s); }
  add('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function(){
    add('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', function(){
      add(BY_ID[key].code);
    });
  });
})();
</script>
</body>
</html>
